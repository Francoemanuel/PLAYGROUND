
{% extends 'base.html' %}

{% block content %}

<h2>Agrega un nuevo libro</h2>

<form method='post' enctype='multipart/form-data'>
    {% csrf_token %}
    {{ form.as_p }}

    
    {% if form.cover.errors %}
        <div class="alert alert-danger">
            {{form.cover.errors}}
        </div>
    {% endif %}
        

    <button type="submit">Guardar</button>

</form>

{% endblock content %}
